---
driver:
  name: vagrant

verifier:
  name: inspec

transport:
  name: rsync

provisioner:
  name: cinc_infra
  product_version: '18'
  enforce_idempotency: true
  multiple_converge: 2
  deprecations_as_errors: true

platforms:
  - name: almalinux-8
  - name: almalinux-9

suites:
  - name: yourls
    run_list:
      - recipe[php-apps-test::yourls]

  - name: wordpress
    run_list:
      - recipe[php-apps-test::wordpress]

  - name: wordpress-customer-upgrades
    run_list:
      - recipe[php-apps-test::wordpress_customer_upgrades]
